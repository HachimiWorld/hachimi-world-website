<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <title>基米天堂</title>
  <link rel="icon" href="/favicon.ico">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FFF8F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#2B2625" media="(prefers-color-scheme: dark)">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }

    @media (prefers-color-scheme: light) {
      body {
        background-color: #EBE9E7;
        color: #000;
      }
    }

    @media (prefers-color-scheme: dark) {
      body {
        background-color: #2B2625;
        color: #fff;
      }
    }
  </style>
  <script>
    window.onload = async () => {
      // https://hachimi.world/song/jm-abcd-123
      // Get the jmid
      // Get from path-last part, or from id query
      const jmid = getJmidFromUrl()
      console.log('jmid', jmid)
      if (jmid == null) {
        showErrorMessage("参数错误")
        return
      }

      let data;
      try {
        let resp = await fetch(`https://api.hachimi.world/song/detail?id=${jmid}`)
        data = await resp.json()
      } catch (e) {
        showErrorMessage("加载失败，请刷新页面重试")
        return
      }
      console.log('data', data)

      if (!data.ok) {
        if (data.data.code === "not_found") {
          showErrorMessage("没有找到这首歌")
        } else {
          showErrorMessage("出错了")
        }
        return
      }

      // Set window title to song title
      document.title = `${data.data.title} by ${data.data.uploader_name} - 基米天堂`

      document.getElementById('jmid').innerText = data.data.display_id
      document.getElementById('cover').src = data.data.cover_url
      document.getElementById('title').innerText = data.data.title
      document.getElementById('subtitle').innerText = data.data.subtitle
      document.getElementById('author').innerText = data.data.uploader_name
      let content = document.getElementById('content')
      content.style.display = 'block';
    }

    function getJmidFromUrl() {
      const url = new URL(window.location.href);
      let jmid = url.pathname.split('/').pop()
      if (checkJmid(jmid)) {
        return jmid.toUpperCase()
      }

      jmid = url.searchParams.get('id');
      if (checkJmid(jmid)) {
        return jmid.toUpperCase()
      }
      return null
    }

    function showErrorMessage(msg) {
      const errBox = document.getElementById('error')
      errBox.innerText = msg
      errBox.style.display = 'block';
    }

    function checkJmid(input) {
      if (input == null) return false
      const uppercase = input.toUpperCase()
      return uppercase.startsWith("JM-")
    }
  </script>
</head>
<body>
<!--<div id="content" style="display: none">-->
<div id="content">
  <div id="jmid">JM-ABCD-123</div>
  <img id="cover" alt="歌曲封面">
  <div id="title">歌曲标题</div>
  <div id="subtitle">副标题</div>
  <div>
    作者：<div id="author">作者</div>
  </div>
  <button>打开客户端</button>
  <button>进入网页端播放</button>
</div>
<div id="error" style="display: none"></div>
<div id="loading" style="display: block"></div>
</body>
</html>
