  <style>

        --primary: var(--light-primary-color);
        --bg: var(--light-bg);
        --text: var(--light-text);
        --surface: var(--light-card-bg);

        --surface-2: rgba(255, 255, 255, 0.82);

    .row .k { color: var(--muted-2); font-size: 12px; }
    .row .v { font-weight: 800; }

    pre.lyrics {
      margin: 0;
      padding: 12px;
      border-radius: 14px;
      border: 1px solid var(--border);
      background: rgba(0,0,0,0.12);
      color: var(--text);
      overflow: auto;
      max-height: 320px;
      line-height: 1.6;
      font-size: 13px;
      white-space: pre-wrap;

      pre.lyrics { background: rgba(255,255,255,0.55); }

    .message {
      padding: 16px 18px;
      display:flex;

    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;

      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;

  </style>
  <script>
    let jmid = null;

    window.onload = async () => {
      jmid = getJmidFromUrl()
      console.log('jmid', jmid)
      if (jmid == null) {
        showErrorMessage("参数错误")
        return
      }

      // Custom preview player init
      initPreviewPlayer()

      let data;

      try {
        let resp = await fetch(`https://api.hachimi.world/song/detail?id=${jmid}`)
        data = await resp.json()
      } catch (e) {
        showErrorMessage("加载失败，请刷新页面重试")
        return
      }
      console.log('data', data)

      document.getElementById('loading').style.display = 'none';

      if (!data.ok) {
        if (data.data.code === "not_found") {
          showErrorMessage("没有找到这首歌")
        } else {
          showErrorMessage("出错了")
        }
        return
      }

      const song = data.data
      applySongToUI(song)
      applySongToSEO(song)

      document.getElementById('content').style.display = 'block';
    }

    function initPreviewPlayer() {
      const audio = document.getElementById('audio')
      const toggle = document.getElementById('preview-toggle')
      const bar = document.getElementById('preview-bar')
      const time = document.getElementById('preview-time')

      if (!audio || !toggle || !bar || !time) return

      const LIMIT = 60
      let endedByLimit = false

      // If the audio is shorter than LIMIT, cap to the actual duration.
      // Start with LIMIT, then update once metadata is loaded.
      let effectiveLimit = LIMIT

      audio.addEventListener('loadedmetadata', () => {
        if (Number.isFinite(audio.duration) && audio.duration > 0) {
          effectiveLimit = Math.min(LIMIT, audio.duration)
        } else {
          effectiveLimit = LIMIT
        }
        render()
      })

      function fmt(s) {
        s = Math.max(0, Math.floor(s || 0))
        const m = Math.floor(s / 60)
        const r = s % 60
        return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`
      }

      function render() {
        const cur = Math.min(audio.currentTime || 0, effectiveLimit)
        const pct = Math.min(100, effectiveLimit > 0 ? (cur / effectiveLimit) * 100 : 0)
        bar.style.width = `${pct}%`
        time.textContent = `${fmt(cur)} / ${fmt(effectiveLimit)}`
        toggle.textContent = audio.paused ? `播放 ${Math.round(effectiveLimit)} 秒` : '暂停'
      }

      function stopAtLimit() {
        if (!audio.paused) audio.pause()
        endedByLimit = true
        // Reset to start for the next preview
        try { audio.currentTime = 0 } catch (_) {}
        render()
      }

      toggle.addEventListener('click', async () => {
        // If no src yet, ignore (song not loaded)
        if (!audio.src) return

        if (!audio.paused) {
          audio.pause()
          render()
          return
        }

        // If prior play ended by limit, start again from 0
        if (endedByLimit) {
          endedByLimit = false
          try { audio.currentTime = 0 } catch (_) {}
        }

        // Always constrain start time inside [0, effectiveLimit)
        if ((audio.currentTime || 0) >= effectiveLimit) {
          try { audio.currentTime = 0 } catch (_) {}
        }

        try {
          await audio.play()
        } catch (e) {
          // Autoplay blocked or other error
          console.warn('audio.play failed', e)
        }
        render()
      })

      // Keep UI updated
      audio.addEventListener('timeupdate', () => {
        if ((audio.currentTime || 0) >= effectiveLimit) {
          stopAtLimit()
          return
        }
        render()
      })
      audio.addEventListener('pause', render)
      audio.addEventListener('play', render)
      audio.addEventListener('ended', () => {
        // If the audio is shorter than 30s, it may end naturally.
        endedByLimit = false
        render()
      })
      // Prevent seeking beyond limit if user/script tries
      audio.addEventListener('seeking', () => {
        if ((audio.currentTime || 0) > effectiveLimit) {
          try { audio.currentTime = effectiveLimit } catch (_) {}
        }
        render()
      })

      render()
    }

    function applySongToUI(song) {
      document.getElementById('jmid-value').innerText = song.display_id || ''
      document.getElementById('cover').src = song.cover_url || ''
      document.getElementById('cover').alt = `${song.title || '歌曲'} 封面`

      document.getElementById('title').innerText = song.title || '未命名歌曲'
      document.getElementById('subtitle').innerText = song.subtitle || ''
      document.getElementById('subtitle').style.display = song.subtitle ? 'block' : 'none'

      document.getElementById('author').innerText = song.uploader_name || '—'
      document.getElementById('play-count').innerText = `${song.play_count ?? 0}`
      document.getElementById('duration').innerText = formatDuration(song.duration_seconds)

      // tags
      const tagWrap = document.getElementById('tags')
      tagWrap.innerHTML = ''
      if (Array.isArray(song.tags)) {
        for (const t of song.tags) {
          const el = document.createElement('span')
          el.className = 'tag'
          el.textContent = t.name
          tagWrap.appendChild(el)
        }
      }

      // origin infos
      const originList = document.getElementById('origin-list')
      originList.innerHTML = ''
      if (Array.isArray(song.origin_infos) && song.origin_infos.length) {
        for (const o of song.origin_infos) {
          const row = document.createElement('div')
          row.className = 'row'
          const left = document.createElement('div')
          left.innerHTML = `<div class="v">${escapeHtml(o.title || '—')}</div><div class="k">Original</div>`
          const right = document.createElement('div')
          right.style.textAlign = 'right'
          right.innerHTML = `<div class="v">${escapeHtml(o.artist || '—')}</div><div class="k">Artist</div>`
          row.appendChild(left)
          row.appendChild(right)
          originList.appendChild(row)
        }
      } else {
        originList.innerHTML = '<div class="row"><div class="k">暂无原曲信息</div></div>'
      }

      // external links
      const links = document.getElementById('external-links')
      links.innerHTML = ''
      if (Array.isArray(song.external_links) && song.external_links.length) {
        for (const link of song.external_links) {
          const a = document.createElement('a')
          a.className = 'chip'
          a.target = '_blank'
          a.rel = 'noopener'
          a.href = link.url
          a.textContent = `${link.platform}`
          links.appendChild(a)
        }
      } else {
        links.innerHTML = '<span class="k" style="color:var(--muted-2)">暂无外链</span>'
      }

      // lyrics
      const lyricsPre = document.getElementById('lyrics')
      if (song.lyrics) {
        lyricsPre.textContent = song.lyrics
      } else {
        lyricsPre.textContent = '暂无歌词'
      }

      // audio (optional)
      const audio = document.getElementById('audio')
      const audioWrap = document.getElementById('audio-wrap')
      if (song.audio_url) {
        audio.src = song.audio_url
        audioWrap.style.display = 'block'
      } else {
        audioWrap.style.display = 'none'
      }
    }

    function applySongToSEO(song) {
      const title = [song.title, song.uploader_name ? `by ${song.uploader_name}` : null, '基米天堂'].filter(Boolean).join(' · ')
      document.title = title

      const tagNames = Array.isArray(song.tags) ? song.tags.map(t => t.name).filter(Boolean) : []

      // Build a richer SEO description with key terms and structured info first.
      const author = song.uploader_name ? `作者：${song.uploader_name}` : null
      const displayId = song.display_id ? `编号：${song.display_id}` : null
      const duration = (song.duration_seconds != null && !Number.isNaN(Number(song.duration_seconds)))
        ? `时长：${formatDuration(song.duration_seconds)}`
        : null
      const plays = (song.play_count != null) ? `播放：${song.play_count}` : null
      const tagsText = tagNames.length ? `标签：${tagNames.join('、')}` : null

      const intro = [
        `哈基米音乐`,
        song.title ? `《${song.title}》` : null,
        author,
        duration,
        plays,
        tagsText,
        displayId
      ].filter(Boolean).join(' · ')

      const descParts = [song.description, song.subtitle].filter(Boolean)
      const shortLyrics = (song.lyrics || '').replace(/\s+/g, ' ').trim().slice(0, 220)
      const detail = (descParts.join(' / ') || shortLyrics || '').trim()

      let description = intro
      if (detail) description = `${intro}。${detail}`
      // Cap length for SERP friendliness.
      description = clampText(description, 320)

      setMetaByName('description', description)
      // keywords
      const baseKeywords = ['哈基米音乐', '基米天堂', 'Hachimi', '音乐', '开源', '社区']
      const keywords = dedupeKeywords([
        ...baseKeywords,
        ...(song.title ? [song.title] : []),
        ...(song.uploader_name ? [song.uploader_name] : []),
        ...tagNames
      ]).join(', ')
      setMetaByName('keywords', keywords)

      setMetaByProperty('og:title', title)
      setMetaByProperty('og:description', description)
      setMetaByProperty('og:image', song.cover_url || 'https://hachimi.world/static/og-image.jpg')
      setMetaByProperty('og:url', location.href)

      setMetaByName('twitter:title', title)
      setMetaByName('twitter:description', description)
      setMetaByName('twitter:image', song.cover_url || 'https://hachimi.world/static/og-image.jpg')

      // canonical to current page URL (stable & shareable)
      setCanonical(location.origin + location.pathname + (location.search || ''))

      // JSON-LD
      const origin = (Array.isArray(song.origin_infos) && song.origin_infos[0]) ? song.origin_infos[0] : null
      const jsonld = {
        '@context': 'https://schema.org',
        '@type': 'MusicRecording',
        name: song.title || 'Song',
        alternateName: song.subtitle || undefined,
        description: description,
        duration: song.duration_seconds ? `PT${Math.max(0, song.duration_seconds)}S` : undefined,
        url: location.href,
        isFamilyFriendly: song.explicit === false ? true : undefined,
        image: song.cover_url || undefined,
        byArtist: song.uploader_name ? { '@type': 'MusicGroup', name: song.uploader_name } : undefined,
        genre: tagNames.length ? tagNames : undefined,
        datePublished: song.release_time || song.create_time || undefined,
        sameAs: (Array.isArray(song.external_links) ? song.external_links.map(l => l.url).filter(Boolean) : undefined),
        recordingOf: origin ? {
          '@type': 'MusicComposition',
          name: origin.title,
          composer: origin.artist ? { '@type': 'Person', name: origin.artist } : undefined
        } : undefined
      }
      // prune undefined
      for (const k of Object.keys(jsonld)) {
        if (jsonld[k] === undefined) delete jsonld[k]
      }
      const el = document.getElementById('song-jsonld')
      el.textContent = JSON.stringify(jsonld)
    }

    function setCanonical(url) {
      let link = document.querySelector('link[rel="canonical"]')
      if (!link) {
        link = document.createElement('link')
        link.rel = 'canonical'
        document.head.appendChild(link)
      }
      link.href = url
    }

    function setMetaByName(name, content) {
      let el = document.querySelector(`meta[name="${cssEscape(name)}"]`)
      if (!el) {
        el = document.createElement('meta')
        el.setAttribute('name', name)
        document.head.appendChild(el)
      }
      el.setAttribute('content', content)
    }

    function setMetaByProperty(property, content) {
      let el = document.querySelector(`meta[property="${cssEscape(property)}"]`)
      if (!el) {
        el = document.createElement('meta')
        el.setAttribute('property', property)
        document.head.appendChild(el)
      }
      el.setAttribute('content', content)
    }

    function formatDuration(seconds) {
      if (seconds == null || Number.isNaN(Number(seconds))) return '—'
      const s = Math.max(0, Number(seconds))
      const m = Math.floor(s / 60)
      const r = Math.floor(s % 60)
      return `${String(m).padStart(2,'0')}:${String(r).padStart(2,'0')}`
    }

    function escapeHtml(str) {
      return String(str)
        .replaceAll('&', '&amp;')
        .replaceAll('<', '&lt;')
        .replaceAll('>', '&gt;')
        .replaceAll('"', '&quot;')
        .replaceAll("'", '&#39;')
    }

    function cssEscape(str) {
      // minimal escape for attribute selector usage
      return String(str).replaceAll('"', '\\"')
    }

    function getJmidFromUrl() {
      const url = new URL(window.location.href);
      let jmid = url.pathname.split('/').pop()
      if (checkJmid(jmid)) {
        return jmid.toUpperCase()
      }

      jmid = url.searchParams.get('id');
      if (checkJmid(jmid)) {
        return jmid.toUpperCase()
      }
      return null
    }

    function showErrorMessage(msg) {
      document.getElementById('loading').style.display = 'none';
      document.getElementById('error-content').innerText = msg;
      document.getElementById('error').style.display = 'block';
    }

    function checkJmid(input) {
      if (input == null) return false
      const uppercase = input.toUpperCase()
      return uppercase.startsWith("JM-")
    }

    function openClient() {
      window.open('https://hachimi.world/#download', '_self')
    }

    function openWebClient() {
      window.open(`https://hachimi.world/app/#/song/${jmid}`, '_self')
    }

    function openHome() {
      window.open('https://hachimi.world', '_self')
    }

    function clampText(text, maxLen) {
      const t = String(text || '').trim().replace(/\s+/g, ' ')
      if (!maxLen || t.length <= maxLen) return t
      return t.slice(0, maxLen - 1).trimEnd() + '…'
    }

    function dedupeKeywords(list) {
      const seen = new Set()
      const out = []
      for (const raw of (list || [])) {
        const s = String(raw || '').trim()
        if (!s) continue
        const key = s.toLowerCase()
        if (seen.has(key)) continue
        seen.add(key)
        out.push(s)
      }
      return out
    }
  </script>
</head>
